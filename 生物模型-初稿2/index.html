<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幻想生物 3D - 浮晶籠 (Floating Crystal Cage)</title>
  <!-- p5.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #040711;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }
    #info-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #e0f4ff;
      background: rgba(8, 14, 28, 0.88);
      backdrop-filter: blur(14px);
      padding: 16px 20px;
      border-radius: 14px;
      border: 1px solid rgba(80, 200, 255, 0.28);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.7);
      max-width: 370px;
      z-index: 10;
    }
    #info-panel h1 {
      margin: 0 0 6px 0;
      font-size: 21px;
      letter-spacing: 2px;
      color: #7ef9ff;
      text-shadow: 0 0 12px rgba(126, 249, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge {
      font-size: 10px;
      font-weight: normal;
      background: rgba(0, 220, 255, 0.15);
      border: 1px solid rgba(0, 220, 255, 0.4);
      color: #a5f3fc;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .section-title {
      color: #93c5fd;
      font-size: 12px;
      font-weight: bold;
      margin-top: 8px;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .section-title::before {
      content: "◆";
      font-size: 9px;
      color: #38bdf8;
    }
    #info-panel p {
      margin: 2px 0 5px 14px;
      font-size: 12px;
      line-height: 1.45;
      color: #cbd5e1;
    }
    .control-group {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    /* 風暴環境調節滑桿 */
    .storm-box {
      background: rgba(15, 25, 45, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 8px;
    }
    .storm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #7dd3fc;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .storm-status {
      font-size: 11px;
      color: #facc15;
      font-weight: normal;
    }
    .storm-slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #1e293b;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .storm-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      cursor: pointer;
    }
    .storm-presets {
      display: flex;
      gap: 5px;
      margin-top: 6px;
    }
    .preset-btn {
      flex: 1;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      padding: 3px 0;
      font-size: 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .preset-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      color: #ffffff;
      border-color: #38bdf8;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .action-btn {
      flex: 1;
      background: rgba(16, 45, 80, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #e0f2fe;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .action-btn:hover {
      background: rgba(30, 80, 140, 0.9);
      border-color: #7dd3fc;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .action-btn.active {
      background: rgba(14, 165, 233, 0.35);
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      color: #ffffff;
    }
    .theme-btn {
      flex: 1;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #94a3b8;
      padding: 4px 2px;
      font-size: 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .theme-btn:hover {
      color: #f1f5f9;
      border-color: #cbd5e1;
    }
    .theme-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: bold;
    }
    #hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(186, 230, 253, 0.75);
      font-size: 12px;
      letter-spacing: 0.8px;
      pointer-events: none;
      background: rgba(8, 14, 26, 0.82);
      backdrop-filter: blur(8px);
      padding: 7px 20px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      z-index: 10;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="info-panel">
    <h1>
      浮晶籠
      <span class="badge">高空負重力生態種</span>
    </h1>

    <div class="section-title">特徵與棲地</div>
    <p>懸浮於負重力懸浮島高空，呈會呼吸的幾何多面體籠狀。</p>

    <div class="section-title">適應器官</div>
    <p>多面玻璃籠包裹熱氣囊漂浮，伸出晶體天線與離子鬚吸取極光與風暴電荷，存入生物電容囊。</p>

    <div class="section-title">群居策略</div>
    <p>串聯天線形成導電網分擔過載電擊，代價是目標過大易招天敵。</p>

    <div class="section-title">多產不育幼</div>
    <p>隨風暴釋放數萬顆靜電玻璃孢子，靠數量抵禦高空淘汰。</p>

    <!-- 環境互動：風暴強度調節 -->
    <div class="control-group">
      <div class="storm-box">
        <div class="storm-header">
          <span>🌪️ 高空風暴強度 (按 ↑ / ↓ 調節)</span>
          <span class="storm-status" id="storm-label">常態電離風暴 (45%)</span>
        </div>
        <input type="range" min="0" max="100" value="45" class="storm-slider" id="storm-slider" oninput="onStormInput(this.value)">
        <div class="storm-presets">
          <button class="preset-btn" onclick="applyStormPreset(15)">微風晴空</button>
          <button class="preset-btn" onclick="applyStormPreset(50)">常態風暴</button>
          <button class="preset-btn" onclick="applyStormPreset(75)">強烈磁暴</button>
          <button class="preset-btn" onclick="applyStormPreset(98)">超載天劫</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="action-btn" id="btn-network" onclick="toggleConductionNetwork()">⚡ 串聯導電網 (C)</button>
        <button class="action-btn" id="btn-spores" onclick="triggerSporesRelease()">✨ 釋放玻璃孢子 (Space)</button>
      </div>

      <div style="font-size: 11px; color: #94a3b8; margin-top: 8px; margin-bottom: 4px;">生態氛圍色調：</div>
      <div class="btn-row">
        <button class="theme-btn active" id="btn-aurora" onclick="setTheme('aurora')">極光風暴 (1)</button>
        <button class="theme-btn" id="btn-abyss" onclick="setTheme('abyss')">深海冷光 (2)</button>
        <button class="theme-btn" id="btn-solar" onclick="setTheme('solar')">熾熱極光 (3)</button>
      </div>
    </div>
  </div>

  <div id="hint">🌪️ 拖曳風暴滑桿或按方向鍵 [↑/↓] 觀察生物動態反應 | [C] 導電網 | [空白鍵] 孢子</div>

  <script src="sketch.js"></script>
  <script>
    function onStormInput(val) {
      if (window.setStormLevel) window.setStormLevel(val / 100);
      updateStormLabel(val);
    }
    function applyStormPreset(val) {
      document.getElementById('storm-slider').value = val;
      onStormInput(val);
    }
    function updateStormLabel(val) {
      const label = document.getElementById('storm-label');
      if (val < 25) {
        label.innerText = `微風晴空 (${val}%)`;
        label.style.color = '#7dd3fc';
      } else if (val < 65) {
        label.innerText = `常態電離風暴 (${val}%)`;
        label.style.color = '#facc15';
      } else if (val < 85) {
        label.innerText = `強烈磁暴 (${val}%) ⚡抗風群聚`;
        label.style.color = '#fb923c';
      } else {
        label.innerText = `超載天劫 (${val}%) 🚨過載噴發`;
        label.style.color = '#f87171';
      }
    }
  </script>
</body>
</html>
